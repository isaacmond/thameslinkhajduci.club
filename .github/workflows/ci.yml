name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # next-env.d.ts is gitignored; typegen recreates it (and the route types) without a full build.
      - run: npx next typegen

      - run: npm run typecheck

      - run: npm test

      # The build prerenders every page from the public Google Sheet, so it needs outbound network (allowed by default here).
      - run: npm run build
